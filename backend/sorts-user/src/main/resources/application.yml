server:
  port: ${USER_PORT:8081}

spring:
  application:
    name: sorts-user
  datasource:
    # 本地开发：MySQL 跑在 WSL Docker 中，端口 3307（避开宿主 3306）
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3307}/sorts_user?useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:sorts_dev}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      # Redis 由 docker/compose.yml 提供（redis-stack，默认 6379），密码见 docker/.env
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:sorts_dev}
      database: 0
  cloud:
    nacos:
      server-addr: ${NACOS_ADDR:localhost:8848}
      username: ${NACOS_USERNAME:nacos}
      password: ${NACOS_PASSWORD:nacos}
      discovery:
        enabled: ${NACOS_ENABLED:true}
        namespace: ${NACOS_NAMESPACE:public}
        group: ${NACOS_GROUP:DEFAULT_GROUP}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# ========== 项目自定义配置 ==========
sorts:
  internal:
    # 服务间凭证：各服务取值必须一致，生产环境务必用环境变量注入
    token: ${INTERNAL_TOKEN:sorts-internal-dev-token}
    enabled: ${INTERNAL_ENABLED:true}
  jwt:
    # 必须与网关保持一致，生产环境通过环境变量注入
    secret: ${JWT_SECRET:sorts-dev-secret-please-override-by-env-jwt-secret}
    access-expire-minutes: ${JWT_ACCESS_EXPIRE:30}
    refresh-expire-days: ${JWT_REFRESH_EXPIRE:7}
    issuer: sorts

logging:
  level:
    com.sorts: debug
