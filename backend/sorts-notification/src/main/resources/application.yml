server:
  port: ${NOTIFICATION_PORT:8084}

spring:
  application:
    name: sorts-notification
  datasource:
    # 本地开发：MySQL 跑在 WSL Docker 中，端口 3307（避开宿主 3306）
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3307}/sorts_notification?useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:sorts_dev}
    driver-class-name: com.mysql.cj.jdbc.Driver
  cloud:
    nacos:
      server-addr: ${NACOS_ADDR:localhost:8848}
      username: ${NACOS_USERNAME:nacos}
      password: ${NACOS_PASSWORD:nacos}
      discovery:
        enabled: ${NACOS_ENABLED:true}
        namespace: ${NACOS_NAMESPACE:public}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
    openfeign:
      client:
        config:
          default:
            # 提醒扫描跑在调度线程上，下游卡住会拖住整个调度周期，故把超时压短
            connectTimeout: 2000
            readTimeout: 5000

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# ========== 项目自定义配置 ==========
sorts:
  internal:
    # 服务间凭证：各服务取值必须一致，生产环境务必用环境变量注入
    token: ${INTERNAL_TOKEN:sorts-internal-dev-token}
    enabled: ${INTERNAL_ENABLED:true}
  notification:
    # 未设置提醒偏好的用户使用以下默认值
    default-advance-minutes: ${NOTIFY_DEFAULT_ADVANCE:15}
    default-channels: ${NOTIFY_DEFAULT_CHANNELS:APP}
    reminder:
      # 定时提醒总开关（本地排障或压测时可关闭，避免刷屏）
      enabled: ${NOTIFY_REMINDER_ENABLED:true}
      # 默认每分钟扫描一次；秒级精度无意义，反而放大 Feign 压力
      cron: ${NOTIFY_REMINDER_CRON:0 * * * * ?}
      # 过期留痕清理周期
      cleanup-cron: ${NOTIFY_REMINDER_CLEANUP_CRON:0 30 3 * * ?}
      # 单次扫描向后看的窗口，需 >= 用户可配置的最大提前量
      lookahead-minutes: ${NOTIFY_REMINDER_LOOKAHEAD:60}
      # 单次扫描最多处理多少条候选日程
      batch-limit: ${NOTIFY_REMINDER_BATCH:200}
      # 留痕保留天数，超期清理
      retention-days: ${NOTIFY_REMINDER_RETENTION_DAYS:30}

logging:
  level:
    com.sorts: debug
