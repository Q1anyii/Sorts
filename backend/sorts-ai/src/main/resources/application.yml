server:
  port: ${AI_PORT:8083}

spring:
  application:
    name: sorts-ai
  datasource:
    # 本地开发：MySQL 跑在 WSL Docker 中，端口 3307（避开宿主 3306）
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3307}/sorts_ai?useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:sorts_dev}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      # Redis 由 docker/compose.yml 提供（redis-stack，默认 6379），密码见 docker/.env
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:sorts_dev}
      database: 0
  cloud:
    nacos:
      server-addr: ${NACOS_ADDR:localhost:8848}
      username: ${NACOS_USERNAME:nacos}
      password: ${NACOS_PASSWORD:nacos}
      discovery:
        enabled: ${NACOS_ENABLED:true}
        namespace: ${NACOS_NAMESPACE:public}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
  # 流式接口是长连接，禁用响应压缩避免 SSE 被缓冲
  mvc:
    async:
      request-timeout: 180000

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# ========== 项目自定义配置 ==========
sorts:
  internal:
    # 服务间凭证：各服务取值必须一致，生产环境务必用环境变量注入
    token: ${INTERNAL_TOKEN:sorts-internal-dev-token}
    enabled: ${INTERNAL_ENABLED:true}
  ai:
    # OpenAI 兼容入口；换成任意同协议网关即可切换供应商
    base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com/v1}
    # 必须通过环境变量注入，仓库内不留密钥
    api-key: ${DEEPSEEK_API_KEY:}
    model: ${DEEPSEEK_MODEL:deepseek-chat}
    temperature: ${AI_TEMPERATURE:0.7}
    max-tokens: ${AI_MAX_TOKENS:2048}
    connect-timeout: 10s
    request-timeout: 2m
    # 工具调用最多来回轮数
    max-tool-rounds: 4
    # 多轮对话上下文保留条数
    history-limit: 20
    tool:
      # 「双钥匙」的第一把：关闭时 AI 永远无法直接写数据
      allow-write: ${AI_TOOL_ALLOW_WRITE:false}

logging:
  level:
    com.sorts: debug
