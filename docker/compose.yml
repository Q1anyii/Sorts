# =====================================================================
# 梭子 SORTS · 全栈编排（唯一入口，不再逐个 docker run）
#
#   中间件（默认启动，无 profile）：
#     bash scripts/docker.sh up
#   后端 6 个服务（profile: app）：
#     bash scripts/docker.sh app
#   前端静态站点（profile: web）：
#     bash scripts/docker.sh web
#
#   端口约定（宿主可见，Windows 侧用 localhost 直连）：
#     MySQL    3307（容器内 3306，避开其他项目的 3306）
#     Redis    6379（redis-stack：Redis 本体 + RediSearch 等模块，需密码）
#     Nacos    8848（9848/9849 为 gRPC，客户端必须可达）
#     RabbitMQ 5672 / 控制台 15672
#     网关     8080 / 前端 8088
#
#   单文件的原因：docker compose 的 depends_on 不能跨文件引用服务，
#   放在同一 project 内才能用 healthcheck 把「起服务」和「起依赖」串起来。
# =====================================================================
name: sorts

# ---------------------------------------------------------------- 中间件
services:
  mysql:
    image: mysql:8.0
    container_name: sorts-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-sorts_dev}
      TZ: Asia/Shanghai
      # 让 init 脚本经由的 mysql 客户端连接字符集为 utf8mb4（容器默认 locale 为 C/POSIX，
      # 不设 LANG 时客户端默认 latin1，会把 UTF-8 中文双重编码入库）
      LANG: C.UTF-8
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      # 首次创建数据卷时按文件名顺序自动执行建库建表脚本
      - ../scripts/sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    networks: [sorts-net]

  # 6379 就是项目的 Redis：用 redis-stack 镜像，同一端口既满足普通 Redis 用途，
  # 也自带 RediSearch / RedisJSON（原「6380 原生 redis-server」已停用）
  redis:
    image: redis/redis-stack-server:latest
    container_name: sorts-redis
    restart: unless-stopped
    environment:
      REDIS_ARGS: "--requirepass ${REDIS_PASSWORD:-sorts_dev} --appendonly yes --appendfsync everysec"
      TZ: Asia/Shanghai
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD:-sorts_dev} ping 2>/dev/null | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [sorts-net]

  nacos:
    image: nacos/nacos-server:v2.4.3
    container_name: sorts-nacos
    restart: unless-stopped
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: "false"
      JVM_XMS: 512m
      JVM_XMX: 512m
      JVM_XMN: 256m
      TZ: Asia/Shanghai
    ports:
      - "8848:8848"
      - "9848:9848"
      - "9849:9849"
    volumes:
      - nacos-data:/home/nacos/data
      - nacos-logs:/home/nacos/logs
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8848/nacos/v1/console/health/liveness || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    networks: [sorts-net]

  # 当前代码里提醒走 @Scheduled（无 MQ 依赖）；此容器为「事务性消息 / outbox」技术债预留
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: sorts-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-sorts}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-sorts_dev}
      TZ: Asia/Shanghai
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_CONSOLE_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s
    networks: [sorts-net]

  # ------------------------------------------------------- 后端服务（profile: app）
  gateway:
    <<: &service
      restart: unless-stopped
      networks: [sorts-net]
      environment:
        TZ: Asia/Shanghai
        NACOS_ADDR: nacos:8848
        NACOS_ENABLED: "true"
        MYSQL_HOST: mysql
        MYSQL_PORT: "3306"
        MYSQL_USER: root
        MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:-sorts_dev}
        REDIS_HOST: redis
        REDIS_PORT: "6379"
        REDIS_PASSWORD: ${REDIS_PASSWORD:-sorts_dev}
        INTERNAL_TOKEN: ${INTERNAL_TOKEN:-sorts-internal-dev-token}
        DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
        JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=70 -XX:+UseSerialGC -Duser.timezone=Asia/Shanghai"
    profiles: ["app"]
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
      args:
        MODULE: sorts-gateway
    image: sorts/gateway:local
    container_name: sorts-gateway
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/actuator/health | grep -q UP"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    depends_on:
      redis: { condition: service_healthy }
      nacos: { condition: service_started }
    ports:
      - "${GATEWAY_PORT:-8080}:8080"

  user:
    <<: *service
    profiles: ["app"]
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
      args:
        MODULE: sorts-user
    image: sorts/user:local
    container_name: sorts-user
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8081/actuator/health | grep -q UP"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
      nacos: { condition: service_started }

  schedule:
    <<: *service
    profiles: ["app"]
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
      args:
        MODULE: sorts-schedule
    image: sorts/schedule:local
    container_name: sorts-schedule
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8082/actuator/health | grep -q UP"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
      nacos: { condition: service_started }
      user: { condition: service_started }

  ai:
    <<: *service
    profiles: ["app"]
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
      args:
        MODULE: sorts-ai
    image: sorts/ai:local
    container_name: sorts-ai
    healthcheck:
      # 注意：健康检查只看进程与依赖；未配 DEEPSEEK_API_KEY 时 /ai/** 返回 503，但健康仍是 UP
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8083/actuator/health | grep -q UP"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
      nacos: { condition: service_started }

  notification:
    <<: *service
    profiles: ["app"]
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
      args:
        MODULE: sorts-notification
    image: sorts/notification:local
    container_name: sorts-notification
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8084/actuator/health | grep -q UP"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
      nacos: { condition: service_started }

  mall:
    <<: *service
    profiles: ["app"]
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
      args:
        MODULE: sorts-mall
    image: sorts/mall:local
    container_name: sorts-mall
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8085/actuator/health | grep -q UP"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
      nacos: { condition: service_started }

  # ------------------------------------------------------- 前端站点（profile: web）
  frontend:
    profiles: ["web"]
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    image: sorts/frontend:local
    container_name: sorts-frontend
    restart: unless-stopped
    depends_on:
      gateway: { condition: service_started }
    ports:
      - "${FRONTEND_PORT:-8088}:80"
    networks: [sorts-net]

networks:
  sorts-net:
    name: sorts-net
    driver: bridge

volumes:
  mysql-data:
  redis-data:
  nacos-data:
  nacos-logs:
  rabbitmq-data:
